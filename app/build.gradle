plugins {
    alias(libs.plugins.android.application)
}

// La clave se incorpora al APK por decisión del propietario. No se imprime ni se versiona.
// Lee la configuración existente de backend/.env solo durante la compilación.
def bioEnv = new Properties()
def bioEnvFile = rootProject.file('backend/.env')
if (bioEnvFile.exists()) {
    bioEnvFile.withReader('UTF-8') { bioEnv.load(it) }
}
def unquote = { String value ->
    def result = (value ?: '').trim()
    if (result.length() >= 2 && ((result.startsWith('"') && result.endsWith('"')) ||
            (result.startsWith("'") && result.endsWith("'")))) result = result.substring(1, result.length() - 1)
    result
}
def bioKey = unquote(providers.environmentVariable('OPENAI_API_KEY').orElse(bioEnv.getProperty('OPENAI_API_KEY', '')).get())
def bioModel = unquote(providers.environmentVariable('OPENAI_MODEL').orElse(bioEnv.getProperty('OPENAI_MODEL', 'gpt-4o-mini')).get())
if (!bioKey) throw new GradleException('Falta OPENAI_API_KEY en backend/.env o en el entorno para compilar Bio.')

android {
    namespace 'com.uteq.sofware.deteccindeequiposlaboratoriodebiotecnologa'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.uteq.sofware.deteccindeequiposlaboratoriodebiotecnologa"
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName "1.0"
        buildConfigField 'String', 'OPENAI_API_KEY', groovy.json.JsonOutput.toJson(bioKey)
        buildConfigField 'String', 'OPENAI_MODEL', groovy.json.JsonOutput.toJson(bioModel)

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }

    androidResources {
        // best.tflite debe quedar SIN comprimir dentro del APK: si AAPT lo comprime,
        // AssetManager.openFd() (usado para mapear el modelo directo a memoria en
        // YoloTfliteDetector) falla en tiempo de ejecucion con "This file can not be
        // opened as a file descriptor; it is probably compressed".
        noCompress "tflite"
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.recyclerview

    // CameraX: vista previa de cámara en tiempo real (preparado para la futura inferencia YOLO)
    implementation libs.camera.core
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view

    // Peticiones HTTPS directas a OpenAI (Responses API).
    implementation libs.volley

    // Almacenamiento cifrado de la OpenAI API Key introducida por el usuario (Android Keystore)
    implementation libs.security.crypto

    // LiteRT (nombre actual de TensorFlow Lite): runtime de inferencia para YoloTfliteDetector.
    // Mismo ecosistema que ai-edge-litert (usado en Colab para exportar best.tflite) -> misma
    // familia de runtime que interpreta el flatbuffer generado. CPU/XNNPACK por defecto (ver
    // docs/YOLO_SETUP.md, "CPU vs. GPU delegate en Android"), sin delegate GPU por ahora.
    implementation libs.litert

    testImplementation libs.junit
    testImplementation 'org.json:json:20240303'
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
